<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VoyageFlow — Builder</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="page">

  <nav class="nav glass-nav fade-in">
    <div class="nav-left">
      <button class="back-btn" id="backBtn">←</button>
      <div class="brand">VoyageFlow</div>
    </div>
    <div class="nav-right">
      <div id="profileNameCalc" class="profile-pill">Profile</div>
    </div>
  </nav>

  <main class="builder-layout fade-seq">

    <section class="builder-left">
      <div class="stepper">
        <div class="dot active" id="dot1">1</div>
        <div class="line"></div>
        <div class="dot" id="dot2">2</div>
        <div class="line"></div>
        <div class="dot" id="dot3">3</div>
      </div>

      <div id="step1" class="step-box">
        <h2>Select Options</h2>
        <div id="optionsGrid" class="option-grid"></div>
      </div>

      <div id="step2" class="step-box hidden">
        <h2>Trip Details</h2>

        <div class="form-row">
          <label>Start Date</label>
          <input id="startDate" type="date">
        </div>

        <div class="form-row">
          <label>End Date</label>
          <input id="endDate" type="date">
        </div>

        <div class="form-row">
          <label>Travelers</label>
          <div class="counter">
            <button id="travMinus">−</button>
            <div id="travelerCount">1</div>
            <button id="travPlus">+</button>
          </div>
        </div>
      </div>

      <div id="step3" class="step-box hidden">
        <h2>Review</h2>
        <div id="reviewList" class="review"></div>
      </div>

      <div class="action-row">
        <button id="prevBtn" class="btn-secondary hidden">Previous</button>
        <button id="nextBtn" class="btn-primary disabled">Next</button>
        <button id="confirmBtn" class="btn-primary hidden">Confirm</button>
      </div>
    </section>

    <aside class="builder-right glass-card slide-in">
      <h3>Price Summary</h3>

      <div class="summary-row">
        <span>Subtotal</span><strong id="subtotal">$0.00</strong>
      </div>

      <div class="summary-row hidden" id="discountRow">
        <span>Discount</span><strong id="discountAmt">-$0.00</strong>
      </div>

      <div class="summary-row total">
        <span>Total</span><strong id="total">$0.00</strong>
      </div>

      <div class="promo">
        <input id="promoInput" placeholder="Promo code">
        <button id="applyPromoBtn" class="btn-secondary">Apply</button>
      </div>
    </aside>

  </main>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-box pop">
      <h2>Booking Confirmed</h2>
      <p id="modalSummary" class="muted"></p>
      <button id="finishBtn" class="btn-primary full">Back to Explore</button>
    </div>
  </div>

  <script src="assets/shared.js"></script>
  <script src="assets/calculator.js"></script>
</body>
</html>
